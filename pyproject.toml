[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome-lab"
version = "0.3.0"
description = "Graph ML and representation learning on the complete MaleCNS fruit-fly connectome"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Avin Sharma"}]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "requests>=2.31",
  "scipy>=1.11",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
neuprint = ["neuprint-python>=0.6.3"]

[project.scripts]
connectome-lab = "connectome_lab.cli:main"
flybrain-data = "connectome_lab.malecns:main"
flybrain-fm = "connectome_lab.flybrain_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
